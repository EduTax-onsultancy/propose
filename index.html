<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="তোমার জন্য একটি বিশেষ বার্তা 💝">
    <meta property="og:description" content="ক্লিক করে দেখে নাও তোমার জন্য কী অপেক্ষা করছে...">
    <title>আমার মনের কথা</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Anek Bangla', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffdde1, #ff758c);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            text-align: center; overflow-x: hidden; overflow-y: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95); padding: 40px 30px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); max-width: 500px; width: 90%;
            position: relative; z-index: 10; max-height: 90vh; overflow-y: auto;
        }

        /* --- Generator Section --- */
        #generator-section { display: none; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; color: #ff4757; font-weight: 600; margin-bottom: 5px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 10px; border: 2px solid #fecfef; border-radius: 8px;
            font-family: 'Anek Bangla', sans-serif; font-size: 14px; box-sizing: border-box;
        }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #ff4757; }
        
        #generated-link-box {
            margin-top: 20px; padding: 15px; background: #fff0f2; border-radius: 10px; display: none;
        }
        #generatedLink { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ff4757; border-radius: 5px; }
        .action-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        /* --- Welcome Screen & Gift Box --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 1s ease; display: none;
        }

        .gift-box-container {
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s;
        }
        .gift-box-container:hover { transform: scale(1.1); }
        
        .gift-icon {
            font-size: 120px;
            line-height: 1;
            animation: shake 1.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: rotate(-10deg); }
            20%, 40%, 60%, 80% { transform: rotate(10deg); }
        }

        .tap-text {
            color: #ff4757; font-size: 24px; font-weight: 800; margin-top: 20px;
            animation: pulseText 1.5s infinite; text-shadow: 0px 2px 5px rgba(255,71,87,0.3);
        }

        @keyframes pulseText {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* --- Fireworks Emojis --- */
        .firework-emoji {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            z-index: 1000;
            animation: shoot 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes shoot {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5); opacity: 0; }
        }

        /* --- Proposal View Styles --- */
        #proposal-section { display: none; opacity: 0; transform: translateY(30px); }
        .show-proposal { display: block !important; animation: fadeInUp 1.5s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .image-container {
            width: 150px; height: 150px; margin: 0 auto 20px auto; border-radius: 50%;
            overflow: hidden; border: 5px solid #ff758c; box-shadow: 0 5px 15px rgba(255, 117, 140, 0.5);
        }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        h1 { color: #ff4757; font-size: 26px; margin-bottom: 10px; }
        h2.title { color: #ff4757; font-size: 22px; }
        .message-text { color: #555; font-size: 18px; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }

        button {
            padding: 10px 20px; font-size: 15px; font-family: 'Anek Bangla', sans-serif;
            border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-weight: 600;
        }
        .btn-primary { background: #ff4757; color: white; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); width: 100%; margin-top: 10px; }
        .btn-primary:hover { background: #ff2e43; transform: translateY(-2px); }
        .btn-secondary { background: #555; color: white; flex: 1; }
        .btn-secondary:hover { background: #333; }
        
        .btn-yes { background: #ff4757; color: white; }
        .btn-wait { background: white; color: #ff4757; border: 2px solid #ff4757; }
        .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

        .heart { position: absolute; color: #ff4757; opacity: 0; z-index: 1; animation: float 4s linear infinite; pointer-events: none; }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- মিউজিক ফাইল -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Welcome Screen with Animated Gift Box -->
    <div id="welcome-screen">
        <div class="gift-box-container" onclick="startSurprise(event)">
            <div class="gift-icon" id="giftIcon">🎁</div>
            <div class="tap-text" id="tapText">সারপ্রাইজ খুলতে ট্যাপ করো!</div>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div id="hearts-container"></div>

    <div class="container">
        
        <!-- GENERATOR FORM -->
        <div id="generator-section">
            <h2 class="title">✨ প্রপোজাল লিংক তৈরি করো ✨</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">নিজের মনের কথা লিখে একটি স্পেশাল লিংক তৈরি করো।</p>
            
            <div class="input-group">
                <label>পার্টনারের নাম:</label>
                <input type="text" id="partnerName" placeholder="যেমন: রিয়া">
            </div>
            
            <div class="input-group">
                <label>তোমার নাম:</label>
                <input type="text" id="yourName" placeholder="যেমন: মারুফ">
            </div>

            <div class="input-group">
                <label>তোমার মনের কথা:</label>
                <textarea id="customMessage" rows="4" placeholder="তোমার মনের কথাগুলো এখানে লেখো..."></textarea>
            </div>

            <div class="input-group">
                <label>হোয়াটসঅ্যাপ নম্বর (কান্ট্রি কোড সহ):</label>
                <input type="number" id="waNumber" placeholder="যেমন: 919876543210">
            </div>

            <div class="input-group">
                <label>ছবির লিংক (অপশনাল):</label>
                <input type="text" id="imgUrl" placeholder="যেকোনো অনলাইন ইমেজের লিংক দাও">
            </div>

            <button class="btn-primary" onclick="generateLink()">ম্যাজিক লিংক তৈরি করো 🪄</button>

            <div id="generated-link-box">
                <label style="color: #ff4757; font-weight: 600; display: block; margin-bottom: 5px;">তোমার লিংক রেডি!</label>
                <input type="text" id="generatedLink" readonly>
                
                <div class="action-buttons">
                    <button class="btn-primary" style="flex: 1; margin-top: 0;" onclick="copyLink()">কপি করো</button>
                    <button id="shortenBtn" class="btn-secondary" onclick="shortenLink()">শর্ট করো</button>
                </div>
            </div>
        </div>

        <!-- PROPOSAL VIEW -->
        <div id="proposal-section">
            <div class="image-container">
                <img id="displayImage" src="https://images.unsplash.com/photo-1518199266791-5375a83164ba?w=500&q=80" alt="Romantic">
            </div>

            <h1>প্রিয় <span id="displayPartner"></span>,</h1>
            <div class="message-text" id="displayMessage"></div>
            <p style="font-weight: 600; color: #ff4757; margin-top: 15px;">ইতি,<br><span id="displayYourName"></span></p>

            <div class="buttons">
                <button class="btn-yes" onclick="sendReply('yes')">হ্যাঁ, আমি রাজি ❤️</button>
                <button class="btn-wait" onclick="sendReply('wait')">একটু সময় চাই 😊</button>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('to') && urlParams.has('msg')) {
            document.getElementById('welcome-screen').style.display = 'flex';
            document.getElementById('displayPartner').innerText = urlParams.get('to');
            document.getElementById('displayYourName').innerText = urlParams.get('from');
            document.getElementById('displayMessage').innerText = urlParams.get('msg');
            const imgUrl = urlParams.get('img');
            if(imgUrl) document.getElementById('displayImage').src = imgUrl;
        } else {
            document.getElementById('generator-section').style.display = 'block';
            document.body.style.overflowY = 'auto';
        }

        function startSurprise(event) {
            document.getElementById('bgMusic').play().catch(e => console.log("Audio autoplay prevented"));
            
            document.getElementById('giftIcon').style.display = 'none';
            document.getElementById('tapText').style.display = 'none';

            createExplosion(event.clientX, event.clientY);

            setTimeout(() => createExplosion(window.innerWidth * 0.2, window.innerHeight * 0.3), 400);
            setTimeout(() => createExplosion(window.innerWidth * 0.8, window.innerHeight * 0.6), 800);
            setTimeout(() => createExplosion(window.innerWidth * 0.5, window.innerHeight * 0.2), 1200);
            setTimeout(() => createExplosion(window.innerWidth * 0.3, window.innerHeight * 0.8), 1600);

            setTimeout(() => {
                const welcomeScreen = document.getElementById('welcome-screen');
                welcomeScreen.style.opacity = '0';
                setTimeout(() => { welcomeScreen.style.display = 'none'; document.body.style.overflowY = 'auto'; }, 1000);
                
                document.getElementById('proposal-section').classList.add('show-proposal');
                createHeartsBackground();
            }, 2500); 
        }

        function createExplosion(x, y) {
            const emojis = ['❤️', '💋', '💖', '🥰', '😍', '✨', '🎉', '🌹'];
            const container = document.getElementById('welcome-screen');
            
            for(let i = 0; i < 40; i++) {
                let el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.className = 'firework-emoji';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                
                let angle = Math.random() * Math.PI * 2;
                let distance = Math.random() * (window.innerWidth / 1.5) + 50; 
                let tx = Math.cos(angle) * distance;
                let ty = Math.sin(angle) * distance + (Math.random() * 100); 
                
                el.style.setProperty('--tx', tx + 'px');
                el.style.setProperty('--ty', ty + 'px');
                container.appendChild(el);
                
                setTimeout(() => el.remove(), 1200);
            }
        }

        function createHeartsBackground() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                container.appendChild(heart);
            }
        }

        function generateLink() {
            const partner = document.getElementById('partnerName').value;
            const you = document.getElementById('yourName').value;
            const msg = document.getElementById('customMessage').value;
            const wa = document.getElementById('waNumber').value;
            const img = document.getElementById('imgUrl').value;

            if(!partner || !msg || !wa) {
                alert("দয়া করে নাম, মেসেজ এবং হোয়াটসঅ্যাপ নম্বর দিন!");
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const finalUrl = `${baseUrl}?to=${encodeURIComponent(partner)}&from=${encodeURIComponent(you)}&msg=${encodeURIComponent(msg)}&wa=${encodeURIComponent(wa)}&img=${encodeURIComponent(img)}`;

            document.getElementById('generatedLink').value = finalUrl;
            document.getElementById('generated-link-box').style.display = 'block';
            
            const shortBtn = document.getElementById('shortenBtn');
            shortBtn.innerText = "শর্ট করো";
            shortBtn.disabled = false;
        }

        // আপডেট করা লিংক শর্ট করার ফাংশন
        async function shortenLink() {
            const longUrl = document.getElementById('generatedLink').value;
            const shortBtn = document.getElementById('shortenBtn');
            
            if (!longUrl || longUrl.length < 50) { 
                alert("লিংকটি ইতিমধ্যেই ছোট আছে বা তৈরি হয়নি!"); 
                return; 
            }

            shortBtn.innerText = "অপেক্ষা করুন...";
            shortBtn.disabled = true;

            try {
                const apiUrl = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if(data.contents && data.contents.includes("tinyurl.com")) {
                    document.getElementById('generatedLink').value = data.contents;
                    shortBtn.innerText = "ছোট হয়েছে! ✅";
                } else {
                    throw new Error("Failed");
                }
            } catch (error) {
                alert("দুঃখিত, কোনো টেকনিক্যাল কারণে সরাসরি লিংক ছোট করা যাচ্ছে না। দয়া করে বড় লিংকটিই কপি করে পাঠিয়ে দিন।");
                shortBtn.innerText = "শর্ট করো"; 
                shortBtn.disabled = false;
            }
        }

        function copyLink() {
            const copyText = document.getElementById('generatedLink');
            copyText.select();
            document.execCommand("copy");
            alert("লিংক কপি করা হয়েছে! এবার যাকে পাঠাতে চাও তাকে পাঠিয়ে দাও।");
        }

        function sendReply(answer) {
            const waNumber = urlParams.get('wa');
            let message = answer === 'yes' 
                ? "হ্যাঁ, আমি রাজি! ❤️ তোমার প্রপোজালটি আমার খুব ভালো লেগেছে।" 
                : "আমি তোমার কথাগুলো ভেবে দেখছি, আমাকে একটু সময় দাও। 😊";
            window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
    </html>
