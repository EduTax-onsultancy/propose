<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="তোমার জন্য একটি বিশেষ বার্তা 💝">
    <meta property="og:description" content="ক্লিক করে দেখে নাও তোমার জন্য কী অপেক্ষা করছে...">
    <title>আমার মনের কথা</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0; font-family: 'Anek Bangla', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffdde1, #ff758c);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            text-align: center; overflow-x: hidden;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .container {
            background: rgba(255, 255, 255, 0.95); padding: 30px 20px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); max-width: 500px; width: 92%; 
            position: relative; z-index: 10; max-height: 95vh; overflow-y: auto;
        }

        /* --- Generator Section --- */
        #generator-section { display: none; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; color: #ff4757; font-weight: 600; margin-bottom: 5px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 10px; border: 2px solid #fecfef; border-radius: 8px;
            font-family: 'Anek Bangla', sans-serif; font-size: 15px;
        }
        .input-group textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #ff4757; }
        
        #generated-link-box { margin-top: 20px; padding: 15px; background: #fff0f2; border-radius: 10px; display: none; }
        #generatedLink { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ff4757; border-radius: 5px; }
        .action-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        button {
            padding: 10px 20px; font-size: 15px; font-family: 'Anek Bangla', sans-serif;
            border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-weight: 600;
        }
        .btn-primary { background: #ff4757; color: white; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); width: 100%; margin-top: 10px; }
        .btn-primary:hover { background: #ff2e43; transform: translateY(-2px); }
        .btn-secondary { background: #555; color: white; flex: 1; }
        
        .btn-yes { background: #ff4757; color: white; flex: 1; }
        .btn-wait { background: white; color: #ff4757; border: 2px solid #ff4757; flex: 1; }
        .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: nowrap; }

        /* ================= 3D DOORS CSS ================= */
        #door-scene {
            perspective: 1200px; /* 3D এফেক্ট তৈরি করে */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; display: none;
        }

        .door {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'); /* সুন্দর কাঠের টেক্সচার */
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .door-left { left: 0; transform-origin: left; border-right: 2px solid #b32a35; }
        .door-right { right: 0; transform-origin: right; border-left: 2px solid #b32a35; }
        
        /* দরজা খোলার অ্যানিমেশন */
        .door-left.open { transform: rotateY(-110deg); }
        .door-right.open { transform: rotateY(110deg); }

        .door-text-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 201; pointer-events: none; transition: opacity 0.5s;
        }

        .door-text {
            background: rgba(255, 255, 255, 0.9); color: #ff4757; padding: 15px 25px;
            border-radius: 30px; font-size: 20px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); animation: pulseText 1.5s infinite;
        }

        /* ================= THE ROOM (Welcome Screen) ================= */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* রোমান্টিক কাপেল ব্যাকগ্রাউন্ড */
            background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83164ba?w=1080&q=80');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 1s ease; display: none;
        }

        /* ঘরের ভেতরের ডার্ক ওভারলে */
        #welcome-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); /* ডার্ক রোমান্টিক ভাইব */
            z-index: 101;
        }

        .gift-box-container {
            position: relative; z-index: 102; /* ওভারলের ওপরে রাখার জন্য */
            cursor: pointer; text-align: center; transition: transform 0.3s;
            background: rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 20px;
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(255, 71, 87, 0.3);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .gift-box-container:hover { transform: scale(1.1); }
        
        .gift-icon { font-size: 100px; line-height: 1; animation: shake 1.5s infinite; }
        .tap-text { color: #fff; font-size: 22px; font-weight: 800; margin-top: 15px; animation: pulseText 1.5s infinite; }

        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 10%, 30%, 50%, 70%, 90% { transform: rotate(-10deg); } 20%, 40%, 60%, 80% { transform: rotate(10deg); } }
        @keyframes pulseText { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }

        /* --- Proposal View Styles --- */
        #proposal-section { display: none; opacity: 0; transform: translateY(30px); }
        .show-proposal { display: block !important; animation: fadeInUp 1.5s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .image-container {
            width: 130px; height: 130px; margin: 0 auto 20px auto; border-radius: 50%;
            overflow: hidden; border: 5px solid #ff758c; box-shadow: 0 5px 15px rgba(255, 117, 140, 0.5);
        }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        h1 { color: #ff4757; font-size: 24px; margin-bottom: 10px; }
        .message-text { color: #555; font-size: 16px; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; text-align: left; }

        .heart { position: absolute; color: #ff4757; opacity: 0; z-index: 1; animation: float 4s linear infinite; pointer-events: none; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        @media (max-width: 400px) { .buttons { flex-direction: column; } .btn-yes, .btn-wait { width: 100%; } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- 3D Door Scene -->
    <div id="door-scene" onclick="openDoors()">
        <div class="door door-left" id="doorLeft"></div>
        <div class="door door-right" id="doorRight"></div>
        <div class="door-text-container" id="doorText">
            <div class="door-text">দরজা খুলতে ট্যাপ করো 🚪</div>
        </div>
    </div>

    <!-- Room inside the Door (Welcome Screen) -->
    <div id="welcome-screen">
        <div class="gift-box-container" onclick="startSurprise(event)">
            <div class="gift-icon" id="giftIcon">🎁</div>
            <div class="tap-text" id="tapText">সারপ্রাইজ খুলতে ট্যাপ করো!</div>
        </div>
    </div>

    <div id="hearts-container"></div>

    <div class="container">
        
        <!-- GENERATOR FORM -->
        <div id="generator-section">
            <h2 style="color: #ff4757; font-size: 22px; margin-bottom: 5px;">✨ প্রপোজাল লিংক তৈরি করো ✨</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">মনের কথা বিস্তারিতভাবে লেখো, লিংক আর কাটবে না!</p>
            
            <div class="input-group">
                <label>পার্টনারের নাম:</label>
                <input type="text" id="partnerName" placeholder="যেমন: রিয়া">
            </div>
            
            <div class="input-group">
                <label>তোমার নাম:</label>
                <input type="text" id="yourName" placeholder="যেমন: মারুফ">
            </div>

            <div class="input-group">
                <label>তোমার মনের কথা:</label>
                <textarea id="customMessage" placeholder="তোমার মনের কথাগুলো এখানে লেখো... (যত খুশি বড় লেখা যায়)"></textarea>
            </div>

            <div class="input-group">
                <label>হোয়াটসঅ্যাপ নম্বর (কান্ট্রি কোড সহ):</label>
                <input type="number" id="waNumber" placeholder="যেমন: 919876543210">
            </div>

            <button class="btn-primary" onclick="generateLink()">ম্যাজিক লিংক তৈরি করো 🪄</button>

            <div id="generated-link-box">
                <label style="color: #ff4757; font-weight: 600; display: block; margin-bottom: 5px;">তোমার লিংক রেডি!</label>
                <input type="text" id="generatedLink" readonly>
                <div class="action-buttons">
                    <button class="btn-primary" style="flex: 1; margin-top: 0;" onclick="copyLink()">কপি করো</button>
                    <button id="shortenBtn" class="btn-secondary" onclick="shortenLink()">শর্ট করো</button>
                </div>
            </div>
        </div>

        <!-- PROPOSAL VIEW -->
        <div id="proposal-section">
            <div class="image-container">
                <img id="displayImage" src="photo.jpg" alt="Our Picture">
            </div>
            <h1 style="text-align: center;">প্রিয় <span id="displayPartner"></span>,</h1>
            <div class="message-text" id="displayMessage"></div>
            <p style="font-weight: 600; color: #ff4757; margin-top: 15px; text-align: right;">ইতি,<br><span id="displayYourName"></span></p>

            <div class="buttons">
                <button class="btn-yes" onclick="sendReply('yes')">হ্যাঁ, আমি রাজি ❤️</button>
                <button class="btn-wait" onclick="sendReply('wait')">একটু সময় চাই 😊</button>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let globalWaNumber = "";
        
        // চেক করা হচ্ছে প্রপোজাল লিংক কিনা
        if (urlParams.has('m')) {
            document.getElementById('door-scene').style.display = 'block';
            document.getElementById('welcome-screen').style.display = 'flex';
            
            document.getElementById('displayPartner').innerText = LZString.decompressFromEncodedURIComponent(urlParams.get('t'));
            document.getElementById('displayYourName').innerText = LZString.decompressFromEncodedURIComponent(urlParams.get('f'));
            document.getElementById('displayMessage').innerText = LZString.decompressFromEncodedURIComponent(urlParams.get('m'));
            
            globalWaNumber = urlParams.get('w');
        } else {
            document.getElementById('generator-section').style.display = 'block';
            document.body.style.overflowY = 'auto';
        }

        // ================= 3D Door Animation Function =================
        function openDoors() {
            // ১. দরজা খুলতেই মিউজিক শুরু!
            document.getElementById('bgMusic').play().catch(e => console.log("Audio play error"));
            
            // ২. টেক্সট গায়েব করা
            document.getElementById('doorText').style.opacity = '0';
            
            // ৩. দরজা দুদিকে খোলা (3D Rotate)
            document.getElementById('doorLeft').classList.add('open');
            document.getElementById('doorRight').classList.add('open');

            // ৪. ১.৫ সেকেন্ড পর দরজাগুলো মুছে দেওয়া যাতে ক্লিক করতে সমস্যা না হয়
            setTimeout(() => {
                document.getElementById('door-scene').style.display = 'none';
            }, 1500);
        }

        // ================= Gift Box Confetti Animation =================
        function startSurprise(event) {
            document.getElementById('giftIcon').style.display = 'none';
            document.getElementById('tapText').style.display = 'none';

            const duration = 3000;
            const end = Date.now() + duration;
            const emojis = ['💞', '😘', '🥰', '😍', '😚', '🤩', '🥳', '🎉', '🎊', '💋'];

            (function frame() {
                confetti({ particleCount: 4, angle: 60, spread: 60, origin: { x: 0, y: 0.8 }, shapes: ['text'], shapeOptions: { text: { value: emojis } }, scalar: 2.5 });
                confetti({ particleCount: 4, angle: 120, spread: 60, origin: { x: 1, y: 0.8 }, shapes: ['text'], shapeOptions: { text: { value: emojis } }, scalar: 2.5 });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            setTimeout(() => {
                const welcomeScreen = document.getElementById('welcome-screen');
                welcomeScreen.style.opacity = '0';
                setTimeout(() => { welcomeScreen.style.display = 'none'; document.body.style.overflowY = 'auto'; }, 1000);
                
                document.getElementById('proposal-section').classList.add('show-proposal');
                createHeartsBackground();
            }, 3500); 
        }

        function createHeartsBackground() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️'; heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                container.appendChild(heart);
            }
        }

        // ================= Generator Functions =================
        function generateLink() {
            const partner = document.getElementById('partnerName').value;
            const you = document.getElementById('yourName').value;
            const msg = document.getElementById('customMessage').value;
            const wa = document.getElementById('waNumber').value;

            if(!partner || !msg || !wa) { alert("দয়া করে নাম, মেসেজ এবং হোয়াটসঅ্যাপ নম্বর দিন!"); return; }

            const baseUrl = window.location.href.split('?')[0];
            const compPartner = LZString.compressToEncodedURIComponent(partner);
            const compYou = LZString.compressToEncodedURIComponent(you);
            const compMsg = LZString.compressToEncodedURIComponent(msg);
            const encWa = encodeURIComponent(wa);

            const finalUrl = `${baseUrl}?t=${compPartner}&f=${compYou}&m=${compMsg}&w=${encWa}`;

            document.getElementById('generatedLink').value = finalUrl;
            document.getElementById('generated-link-box').style.display = 'block';
            
            const shortBtn = document.getElementById('shortenBtn');
            shortBtn.innerText = "শর্ট করো"; shortBtn.disabled = false;
        }

        async function shortenLink() {
            const longUrl = document.getElementById('generatedLink').value;
            const shortBtn = document.getElementById('shortenBtn');
            if (!longUrl || longUrl.length < 30) { alert("লিংকটি ইতিমধ্যেই ছোট আছে বা তৈরি হয়নি!"); return; }
            shortBtn.innerText = "অপেক্ষা করুন..."; shortBtn.disabled = true;

            try {
                const response = await fetch("https://spoo.me/", {
                    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json" },
                    body: new URLSearchParams({ url: longUrl })
                });
                const data = await response.json();
                if(data.short_url) { document.getElementById('generatedLink').value = data.short_url; shortBtn.innerText = "ছোট হয়েছে! ✅"; } 
                else { throw new Error("Failed"); }
            } catch (error) {
                alert("দুঃখিত, লিংক ছোট করা যাচ্ছে না। দয়া করে বড় লিংকটিই কপি করুন।");
                shortBtn.innerText = "শর্ট করো"; shortBtn.disabled = false;
            }
        }

        function copyLink() {
            const copyText = document.getElementById('generatedLink');
            copyText.select(); document.execCommand("copy");
            alert("লিংক কপি করা হয়েছে! এবার যাকে পাঠাতে চাও তাকে পাঠিয়ে দাও।");
        }

        function sendReply(answer) {
            let message = answer === 'yes' 
                ? "হ্যাঁ, আমি রাজি! ❤️ তোমার প্রপোজালটি আমার খুব ভালো লেগেছে।" 
                : "আমি তোমার কথাগুলো ভেবে দেখছি, আমাকে একটু সময় দাও। 😊";
            window.open(`https://wa.me/${globalWaNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
    </html>
